[project]
name = "livery"
version = "0.1.0"
description = "Batch-restyle Word documents through a Typst template, with content-integrity safeguards."
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
    "pillow>=10",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
livery = "livery.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
