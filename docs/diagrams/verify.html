<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head><body>
<svg id="s" width="1000" height="270" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fb37f"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e06c6c"/></marker>
  </defs>
  <rect class="bg" width="1000" height="270" rx="18"/>
  <rect class="frame" x="24" y="24" width="572" height="222" rx="14"/>
  <g id="rows"></g>
  <g id="wires"></g>

  <!-- check -->
  <circle cx="660" cy="135" r="30" fill="#201e1c" stroke="#eae8e6" stroke-width="1.5"/>
  <text x="660" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#eae8e6">same</text>
  <text x="660" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#eae8e6">words?</text>

  <!-- outcomes -->
  <path class="wire pass" d="M690,135 H716 V80 H742" marker-end="url(#ap)"/>
  <path class="wire fail" d="M716,135 V190 H742" marker-end="url(#af)"/>
  <rect x="746" y="48" width="228" height="64" rx="10" fill="rgba(95,179,127,0.12)" stroke="#5fb37f" stroke-width="1.3"/>
  <text x="764" y="75" font-size="16" font-weight="600" fill="#5fb37f">✓  Ready to export</text>
  <text class="m" x="764" y="96">all 187 words are in the PDF</text>
  <rect x="746" y="158" width="228" height="64" rx="10" fill="rgba(204,68,68,0.14)" stroke="#e06c6c" stroke-width="1.3"/>
  <text x="764" y="185" font-size="16" font-weight="600" fill="#e06c6c">✕  Blocked</text>
  <text class="m" x="764" y="206">a word missing or added</text>
</svg>
<script>
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; parent.appendChild(e); return e; };
const rows = [["WORD SOURCE", ".docx"], ["TYPST MARKUP", "content.typ"], ["PDF TEXT LAYER", "final PDF"]];
const words = ["Q3", "revenue", "grew", "14%", "in", "the", "north"];
const g = document.getElementById("rows"), w = document.getElementById("wires");
document.fonts.ready.then(() => {
  rows.forEach(([label, sub], i) => {
    const y = 60 + i * 64;
    el("text", { class: "eyebrow", x: 46, y: y + 4 }, g, label);
    el("text", { class: "m", x: 46, y: y + 22, "font-size": 11.5 }, g, sub);
    let x = 196;
    for (const word of words) {
      const t = el("text", { x: 0, y: y + 13, "font-size": 13, fill: "#eae8e6" }, g, word);
      const tw = t.getComputedTextLength();
      t.before(el("rect", { x, y: y - 6, width: tw + 16, height: 26, rx: 6, fill: "#2a2827", stroke: "#3a3837" }, g));
      t.setAttribute("x", x + 8);
      x += tw + 22;
    }
    el("path", { class: "wire", d: `M${x},${y + 7} C${x + 60},${y + 7} ${600},135 630,135` }, w);
  });
});
</script></body></html>
