<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"></head><body>
<svg width="1000" height="460" viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a5654"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07850"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99cf0"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fb37f"/></marker>
  </defs>
  <rect class="bg" width="1000" height="460" rx="18"/>

  <!-- your machine -->
  <rect class="frame" x="24" y="24" width="716" height="412" rx="14"/>
  <text class="eyebrow" x="46" y="52">YOUR MACHINE</text>

  <!-- real document -->
  <rect class="card" x="48" y="72" width="190" height="128" rx="10"/>
  <text class="eyebrow" x="62" y="96">YOUR DOCUMENT</text>
  <rect class="page" x="62" y="108" width="162" height="78" rx="4"/>
  <text class="ink" x="72" y="130" font-weight="700">Q3 revenue grew 14%</text>
  <text class="ink" x="72" y="150">Acme Ltd. – Board report</text>
  <text class="ink" x="72" y="170" fill="#9a3b1c" font-weight="600" style="fill:#b5481f">Confidential</text>

  <!-- twin -->
  <rect class="card" x="298" y="72" width="190" height="128" rx="10"/>
  <text class="eyebrow" x="312" y="96">LOREM-IPSUM TWIN</text>
  <rect class="page" x="312" y="108" width="162" height="78" rx="4"/>
  <text class="lorem" x="322" y="130" font-weight="700">Ut laborum nisi 82%</text>
  <text class="lorem" x="322" y="150">Duis Sed. – Lorem tempor</text>
  <text class="lorem" x="322" y="170" font-weight="600">Exercitation</text>

  <path class="wire" d="M238,136 H294" marker-end="url(#a)"/>
  <text class="lbl" x="268" y="126" text-anchor="middle">every word</text>
  <text class="lbl" x="268" y="156" text-anchor="middle">swapped</text>

  <!-- sandbox -->
  <rect x="548" y="64" width="176" height="148" rx="12" fill="rgba(123,104,238,0.12)" stroke="#a99cf0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="eyebrow" x="564" y="88" style="fill:#a99cf0">SANDBOX</text>
  <rect class="card" x="564" y="100" width="144" height="58" rx="9"/>
  <text class="h" x="636" y="126" text-anchor="middle">Claude Code</text>
  <text class="m" x="636" y="145" text-anchor="middle">or Codex</text>
  <text class="m" x="636" y="186" text-anchor="middle">sees the twin only,</text>
  <text class="m" x="636" y="202" text-anchor="middle">no other files</text>
  <path class="wire busy" d="M488,136 H560" marker-end="url(#ab)"/>

  <!-- provider -->
  <text class="eyebrow" x="822" y="74">INTERNET</text>
  <rect class="card" x="822" y="88" width="156" height="72" rx="10"/>
  <text class="h" x="900" y="118" text-anchor="middle">Provider API</text>
  <text class="m" x="900" y="138" text-anchor="middle">the only way out</text>
  <path class="wire busy" d="M708,124 H818" marker-end="url(#ab)"/>
  <text class="lbl busy" x="781" y="114" text-anchor="middle">twin only</text>

  <!-- design back down to the render -->
  <path class="wire accent" d="M636,212 V252 H393 V296" marker-end="url(#aa)"/>
  <rect class="pill-bg" x="425" y="242" width="178" height="20" rx="10" style="fill:#1a1716"/>
  <text class="lbl accent" x="514" y="257" text-anchor="middle">design change · styles only</text>

  <!-- real words straight to the render -->
  <path class="wire" d="M143,200 V340 H294" marker-end="url(#a)"/>
  <text class="lbl" x="218" y="332" text-anchor="middle">real words</text>

  <!-- render + pdf -->
  <rect class="card" x="298" y="300" width="190" height="80" rx="10"/>
  <text class="eyebrow" x="312" y="324">RENDER</text>
  <text class="t" x="312" y="346">your words +</text>
  <text class="t" x="312" y="364">the new design</text>

  <path class="wire pass" d="M488,340 H544" marker-end="url(#ap)"/>
  <rect class="card" x="548" y="300" width="176" height="80" rx="10"/>
  <circle cx="574" cy="340" r="13" fill="rgba(95,179,127,0.16)" stroke="#5fb37f" stroke-width="1.5"/>
  <path d="M567,340 l5,5 l9,-10" fill="none" stroke="#5fb37f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="598" y="336">PDF</text>
  <text class="m" x="598" y="355">every word checked</text>

  <text class="m" x="46" y="416">Your real text never enters the sandbox and never leaves this machine.</text>
</svg></body></html>
